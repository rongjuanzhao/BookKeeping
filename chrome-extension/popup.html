<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易记账</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <div class="app-container">
      <header class="header">
        <h2>资产总览</h2>
        <div class="header-buttons">
          <button id="showRecords" class="text-button">更新记录</button>
          <button id="showCategoryManagement" class="category-management-button">分类管理</button>
          <button id="updateAsset" class="primary-button">更新资产</button>
        </div>
      </header>

      <div class="content">
        <div class="card">
          <h3>资产总览</h3>
          <div class="stats-grid">
            <div class="stat-box">
              <label>总资产</label>
              <div class="stat-value" id="totalAssets">¥0</div>
            </div>
            <div class="stat-box">
              <label>净资产</label>
              <div class="stat-value" id="netWorth">¥0</div>
            </div>
            <div class="stat-box">
              <label>负债</label>
              <div class="stat-value debt" id="liabilities">¥0</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h3>资产构成</h3>
          <div class="chart-container" id="sankeyChart">
            <!-- SVG桑基图将在这里生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 更新资产模态框 -->
    <div id="updateModal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>更新资产信息</h3>
          <button class="close-button" id="closeUpdateModal">×</button>
        </div>
        <div class="modal-body">
          <form id="assetForm">
            <div class="form-grid">
              <div class="form-group">
                <label>银行活期</label>
                <input type="number" name="currentDeposit" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>支付宝</label>
                <input type="number" name="alipay" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>微信</label>
                <input type="number" name="wechat" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>车辆价值</label>
                <input type="number" name="car" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>房产价值</label>
                <input type="number" name="house" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>定期存款</label>
                <input type="number" name="fixedDeposit" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>股票基金</label>
                <input type="number" name="stocks" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>他人借款</label>
                <input type="number" name="receivable" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>车贷</label>
                <input type="number" name="carLoan" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>房贷</label>
                <input type="number" name="mortgage" step="0.01" value="0">
              </div>
              <div class="form-group">
                <label>借贷</label>
                <input type="number" name="borrowing" step="0.01" value="0">
              </div>
            </div>
            <div class="form-actions">
              <button type="button" id="cancelUpdate" class="secondary-button">取消</button>
              <button type="submit" class="primary-button">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 更新记录模态框 -->
    <div id="recordsModal" class="modal-overlay" style="display: none;">
      <div class="modal-content large-modal">
        <div class="modal-header">
          <h3>更新记录</h3>
          <button class="close-button" id="closeRecordsModal">×</button>
        </div>
        <div class="modal-body records-body" id="recordsContent">
          <!-- 动态内容 -->
        </div>
      </div>
    </div>

    <!-- 分类管理模态框 -->
    <div id="categoryManagementModal" class="modal-overlay" style="display: none;">
      <div class="modal-content category-modal">
        <div class="modal-header">
          <h3>分类管理</h3>
          <button class="close-button" id="closeCategoryModal">×</button>
        </div>
        <div class="modal-body category-body" id="categoryContent">
          <!-- 动态内容 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 加载D3和D3-Sankey库 -->
  <script src="lib/d3.v7.min.js"></script>
  <script src="lib/d3-sankey.min.js"></script>

  <script src="src/app.js"></script>
</body>
</html>
