<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易记账</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    h3 {
      color: #333;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .info {
      color: #666;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h3>简易记账</h3>
  <button id="openApp">打开记账应用</button>
  <div class="info">点击按钮在完整窗口中打开应用</div>

  <script src="popup_small.js"></script>
</body>
</html>
